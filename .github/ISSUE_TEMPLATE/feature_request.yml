name: Feature request
description: An idea for something Ironvale should have or do differently.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas you would like to talk through first, the
        [Ideas discussions](https://github.com/Lancimator/ironvale-community/discussions/categories/ideas)
        are a better place. Everything here is **public**.
  - type: textarea
    id: problem
    attributes:
      label: What would it solve?
      description: The moment in the game where you missed it — what were you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you considered?
